name: one_flipcards
description: "One Flipcards."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  drift: ^2.26.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.0.0
  go_router: ^15.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  slang: ^4.7.1
  slang_flutter: ^4.7.0
  sqlite3_flutter_libs: ^0.5.32
  uuid: ^4.5.1
  vector_graphics: ^1.1.18

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  mocktail: ^1.0.4
  slang_build_runner: ^4.7.0
  vector_graphics_compiler: ^1.1.16

flutter:
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler
